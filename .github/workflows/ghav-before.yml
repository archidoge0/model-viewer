name: "ghav before: Unit tests"
"on":
  push:
    branches:
      - ghav/dev/5183
    paths:
      - .ghav/before
jobs:
  full_test_run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
      - name: NPM install
        run: npm ci
      - name: Install playwright browsers
        run: npx playwright install --with-deps
      - name: Build packages
        run: npm run build
      - name: Unit tests
        run: npm run test:ci
